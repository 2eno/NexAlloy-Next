[versions]
composeBom = "2026.06.01"
activityCompose = "1.12.3"
lifecycle = "2.10.0"
navigationCompose = "2.10.0"
work = "2.11.1"
kotlinCompose = "2.2.10"
dexlib2 = "3.0.9"
agp = "9.2.1"
dexkit = "2.3.0"
xposed = "82"
libxposed = "102.0.0"
annotation = "1.10.0"
gson = "2.14.0"
