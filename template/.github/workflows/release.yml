name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build bundle
        run: ./gradlew :bundle:assembleBundle

      # NexAlloy installs every .nxb asset of the latest release of a source repository.
      - name: Create release
        run: gh release create "${{ github.ref_name }}" bundle/build/outputs/bundle/*.nxb --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
