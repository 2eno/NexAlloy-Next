org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Maven repository of the NexAlloy patcher API, and the version to compile against.
nexalloyMaven=https://raw.githubusercontent.com/2eno/NexAlloyNext/maven
patcherVersion=1.2.0
# PATCHER_API_VERSION of that patcher version; NexAlloy refuses bundles built against a newer API.
patcherApiVersion=3
